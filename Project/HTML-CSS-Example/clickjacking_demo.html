<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickjacking Demo</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f0f0; padding: 2rem; }
        .iframe-container {
            border: 2px solid red;
            margin: 20px auto;
            max-width: 1000px;
            height: 600px;
            position: relative;
        }
        .malicious-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 20px;
            font-size: 24px;
            pointer-events: none;
            z-index: 10;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Clickjacking Attack Demonstration</h1>
    <p>This page attempts to load the Course Advising System inside an iframe.</p>
    <p>If clickjacking prevention is working, the iframe should redirect the main window or refuse to load.</p>
    
    <div class="iframe-container">
        <div class="malicious-overlay">Click Here to Win a Prize!</div>
        <iframe src="http://localhost:5173/login"></iframe>
    </div>
</body>
</html>
